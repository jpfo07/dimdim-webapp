<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2a44">DimDim - Arquitetura macro da solução no Microsoft Azure</text>

  <!-- Usuario -->
  <g transform="translate(40,250)">
    <circle cx="50" cy="30" r="22" fill="#3A3A3A"/>
    <path d="M10 100 Q50 45 90 100 Z" fill="#3A3A3A"/>
    <text x="50" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2a44">Usuário</text>
    <text x="50" y="147" text-anchor="middle" font-size="13" fill="#555">Navegador (HTTPS)</text>
  </g>

  <!-- Dev / GitHub -->
  <g transform="translate(40,450)">
    <rect width="190" height="120" rx="12" fill="#24292f"/>
    <text x="95" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">GitHub</text>
    <text x="95" y="62" text-anchor="middle" font-size="13" fill="#d0d7de">Repositório (código)</text>
    <text x="95" y="84" text-anchor="middle" font-size="13" fill="#d0d7de">GitHub Actions</text>
    <text x="95" y="104" text-anchor="middle" font-size="12" fill="#d0d7de">build Maven + deploy</text>
  </g>
  <g transform="translate(40,80)">
    <rect width="190" height="110" rx="12" fill="#eef4fb" stroke="#0078D4" stroke-width="2"/>
    <text x="95" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#0078D4">Azure CLI</text>
    <text x="95" y="62" text-anchor="middle" font-size="13" fill="#333">scripts/01-criar-infra.sh</text>
    <text x="95" y="84" text-anchor="middle" font-size="13" fill="#333">az webapp deploy</text>
  </g>

  <!-- Azure subscription / RG -->
  <rect x="290" y="70" width="780" height="520" rx="18" fill="#f5f9fe" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="100" font-size="15" font-weight="700" fill="#0078D4">Assinatura Azure · Região Brazil South</text>
  <rect x="320" y="115" width="720" height="455" rx="14" fill="#ffffff" stroke="#7aa7d8" stroke-width="1.5"/>
  <text x="340" y="143" font-size="14" font-weight="600" fill="#1f2a44">Resource Group: rg-dimdim-&lt;RM&gt;</text>

  <!-- App Service Plan + Web App -->
  <g transform="translate(350,170)">
    <rect width="300" height="220" rx="12" fill="#e8f1fb" stroke="#0078D4" stroke-width="2"/>
    <text x="150" y="28" text-anchor="middle" font-size="13" fill="#0078D4" font-weight="600">App Service Plan Linux (B1)</text>
    <g transform="translate(110,45)">
      <circle cx="40" cy="40" r="38" fill="#0078D4"/>
      <circle cx="40" cy="40" r="26" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="28" cy="30" r="6" fill="#fff"/><circle cx="52" cy="46" r="6" fill="#fff"/>
    </g>
    <text x="150" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a44">Azure Web App</text>
    <text x="150" y="172" text-anchor="middle" font-size="13" fill="#333">Java 17 · Spring Boot + Thymeleaf</text>
    <text x="150" y="192" text-anchor="middle" font-size="12" fill="#555">App Settings: conexão SQL e AI</text>
  </g>

  <!-- Azure SQL -->
  <g transform="translate(720,170)">
    <rect width="290" height="220" rx="12" fill="#e8f1fb" stroke="#0078D4" stroke-width="2"/>
    <text x="145" y="28" text-anchor="middle" font-size="13" fill="#0078D4" font-weight="600">Azure SQL Server (PaaS)</text>
    <g transform="translate(110,45)">
      <ellipse cx="35" cy="12" rx="35" ry="12" fill="#0078D4"/>
      <rect x="0" y="12" width="70" height="60" fill="#0078D4"/>
      <ellipse cx="35" cy="72" rx="35" ry="12" fill="#005a9e"/>
      <text x="35" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">SQL</text>
    </g>
    <text x="145" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a44">Azure SQL Database</text>
    <text x="145" y="172" text-anchor="middle" font-size="13" fill="#333">dimdimdb (Basic)</text>
    <text x="145" y="192" text-anchor="middle" font-size="12" fill="#555">Tabelas: cliente 1:N conta</text>
  </g>

  <!-- App Insights -->
  <g transform="translate(350,425)">
    <rect width="300" height="125" rx="12" fill="#f3ecfb" stroke="#7a3fc2" stroke-width="2"/>
    <g transform="translate(22,32)">
      <circle cx="28" cy="28" r="28" fill="#7a3fc2"/>
      <rect x="16" y="30" width="6" height="12" fill="#fff"/><rect x="25" y="22" width="6" height="20" fill="#fff"/><rect x="34" y="14" width="6" height="28" fill="#fff"/>
    </g>
    <text x="180" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a44">Application Insights</text>
    <text x="180" y="68" text-anchor="middle" font-size="13" fill="#333">Requests, falhas, performance</text>
    <text x="180" y="88" text-anchor="middle" font-size="13" fill="#333">Dependências SQL (queries)</text>
  </g>
  <g transform="translate(720,425)">
    <rect width="290" height="125" rx="12" fill="#f3ecfb" stroke="#7a3fc2" stroke-width="2"/>
    <text x="145" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a44">Log Analytics Workspace</text>
    <text x="145" y="74" text-anchor="middle" font-size="13" fill="#333">Armazena a telemetria</text>
    <text x="145" y="94" text-anchor="middle" font-size="13" fill="#333">do Application Insights</text>
  </g>

  <!-- Setas -->
  <defs>
    <marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f2a44"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7a3fc2"/></marker>
  </defs>
  <line x1="145" y1="320" x2="345" y2="300" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="240" y="300" text-anchor="middle" font-size="12" fill="#1f2a44">HTTPS</text>
  <line x1="650" y1="280" x2="715" y2="280" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="683" y="270" text-anchor="middle" font-size="12" fill="#1f2a44">JDBC</text>
  <text x="683" y="300" text-anchor="middle" font-size="12" fill="#1f2a44">1433/TLS</text>
  <line x1="500" y1="390" x2="500" y2="420" stroke="#7a3fc2" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="650" y1="487" x2="715" y2="487" stroke="#7a3fc2" stroke-width="2.5" marker-end="url(#r)"/>
  <path d="M230 510 C300 510 300 380 345 360" fill="none" stroke="#24292f" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="300" y="455" font-size="12" fill="#24292f">deploy</text>
  <path d="M230 135 C290 135 300 160 345 200" fill="none" stroke="#0078D4" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="250" y="125" font-size="12" fill="#0078D4">cria recursos</text>
</svg>
