spring.application.name=dimdim

# Porta: no Azure App Service o App Setting SERVER_PORT=80 sobrescreve este valor
server.port=${PORT:8080}

# Conexao com o Azure SQL Database.
# NENHUMA credencial fica no codigo: os valores vem das variaveis de ambiente
# (App Settings do Web App), configuradas pelo script scripts/01-criar-infra.sh
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# As tabelas sao criadas pelo DDL (scripts/ddl.sql), o Hibernate nao altera o schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
