<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | DimDim'">DimDim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="topo(ativo)" class="topo">
    <a th:href="@{/}" class="marca" aria-label="DimDim, página inicial">
        <span class="balao">dim<br>dim</span>
    </a>
    <nav class="menu">
        <a th:href="@{/}" th:classappend="${ativo == 'inicio'} ? 'ativo'">Início</a>
        <a th:href="@{/clientes}" th:classappend="${ativo == 'clientes'} ? 'ativo'">Clientes</a>
        <a th:href="@{/contas}" th:classappend="${ativo == 'contas'} ? 'ativo'">Contas</a>
    </nav>
</header>

<div th:fragment="mensagens">
    <p class="aviso sucesso" th:if="${sucesso}" th:text="${sucesso}" role="status"></p>
    <p class="aviso erro" th:if="${erro}" th:text="${erro}" role="alert"></p>
</div>

<footer th:fragment="rodape" class="rodape">
    DimDim Web App · Java 17 + Spring Boot · Azure App Service + Azure SQL + Application Insights
</footer>

</body>
</html>
