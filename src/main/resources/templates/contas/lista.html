<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Contas')}"></head>
<body>
<header th:replace="~{fragments :: topo('contas')}"></header>
<main class="pagina">
    <div class="cabecalho">
        <h1>Contas</h1>
        <a class="botao" th:href="@{/contas/novo}">Abrir conta</a>
    </div>
    <div th:replace="~{fragments :: mensagens}"></div>

    <p class="vazio" th:if="${#lists.isEmpty(contas)}">Nenhuma conta aberta. Abra uma conta para um cliente já cadastrado.</p>

    <div class="tabela" th:unless="${#lists.isEmpty(contas)}">
        <table>
            <thead>
            <tr><th>ID</th><th>Agência</th><th>Número</th><th>Tipo</th><th class="num">Saldo</th><th>Titular</th><th>Abertura</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${contas}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.agencia}"></td>
                <td th:text="${c.numero}"></td>
                <td th:text="${c.tipo.descricao}"></td>
                <td class="num" th:text="${'R$ ' + #numbers.formatDecimal(c.saldo, 1, 'POINT', 2, 'COMMA')}"></td>
                <td th:text="${c.cliente.nome}"></td>
                <td th:text="${#temporals.format(c.dataAbertura, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="linha-acoes">
                    <a th:href="@{/contas/{id}/editar(id=${c.id})}">Editar</a>
                    <form th:action="@{/contas/{id}/excluir(id=${c.id})}" method="post"
                          onsubmit="return confirm('Encerrar esta conta?')">
                        <button type="submit" class="link-perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
</body>
</html>
